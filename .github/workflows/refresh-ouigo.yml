name: Renovar horario Ouigo
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ouigo-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Verificar el publicador
        run: python3 -m unittest -v test_updater.py
      - name: Descargar y validar el último GTFS
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: python3 refresh_ouigo.py --output docs
      - name: Publicar solo los datos y su atribución
        run: |
          git config user.name 'Rail Radar updater'
          git config user.email 'railradar-updater@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Verify Ouigo timetable publication'
            git push
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar los datos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar los datos
        id: deployment
        uses: actions/deploy-pages@v4
